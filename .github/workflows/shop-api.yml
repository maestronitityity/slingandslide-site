name: Deploy shop API

# Puts shop-api/worker.js on Cloudflare Workers. Needs three repository secrets:
#   CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
#   STRIPE_KEY            (Stripe restricted key, test first, live later)
# The result (address and test/live mode) shows as a notice on the run.

on:
  push:
    branches: [main]
    paths: ['shop-api/**', '.github/workflows/shop-api.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$STRIPE_KEY" ] || missing="$missing STRIPE_KEY"
          if [ -n "$missing" ]; then
            echo "::notice title=Shop API not deployed yet::Add these repository secrets, then run this workflow again:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          case "$STRIPE_KEY" in
            rk_test_*|sk_test_*|rk_live_*|sk_live_*) ;;
            pk_*) echo "::error title=Wrong Stripe key::STRIPE_KEY is a publishable key (pk_). Use a restricted key (rk_) or secret key (sk_)."; exit 1 ;;
            *) echo "::error title=Wrong Stripe key::STRIPE_KEY should start with rk_test_, rk_live_, sk_test_ or sk_live_."; exit 1 ;;
          esac

      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: shop-api
          secrets: |
            STRIPE_KEY
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}

      # Optional: the Google OAuth client secret that lets Android players join Global Rankings
      # with Google Play Games (repository secret PLAY_GAMES_CLIENT_SECRET).
      - name: Play Games sign-in secret
        if: steps.check.outputs.ready == 'true' && env.PGS_CLIENT_SECRET != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: shop-api
          secrets: |
            PGS_CLIENT_SECRET
        env:
          PGS_CLIENT_SECRET: ${{ secrets.PLAY_GAMES_CLIENT_SECRET }}

      - name: Report address and mode
        if: steps.check.outputs.ready == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then echo "::error title=No workers.dev subdomain::Open Cloudflare > Workers & Pages once to pick a workers.dev subdomain, then re-run."; exit 1; fi
          url="https://sling-shop.$sub.workers.dev"
          cfg=""
          for i in 1 2 3 4 5 6; do cfg=$(curl -fsS "$url/config" || true); [ -n "$cfg" ] && break; sleep 10; done
          mode=$(echo "$cfg" | jq -r '.mode // "unreachable"' 2>/dev/null || echo unreachable)
          echo "::notice title=Shop API::$url mode=$mode"
          [ "$mode" = test ] || [ "$mode" = live ] || { echo "::error title=Shop API not answering::$url/config returned: $cfg"; exit 1; }

      # Checks the Game Center sign-in path against Apple's real signing certificates: the
      # server must be able to download and read Apple's key, so a made-up proof is refused
      # only for its signature (anything else means iPhone players can't join Global Rankings).
      - name: Game Center sign-in check
        if: steps.check.outputs.ready == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
          url="https://sling-shop.$sub.workers.dev"
          found=""
          for n in $(seq 20 -1 1); do
            k="https://static.gc.apple.com/public-key/gc-prod-$n.cer"
            if curl -fsS -o "gc-$n.cer" "$k" 2>/dev/null; then
              found="$found $n"
              node --input-type=module -e "import { spkiFromCert } from './shop-api/accounts.js'; import { readFileSync } from 'fs'; const { spki, algo } = spkiFromCert(new Uint8Array(readFileSync('gc-$n.cer'))); await crypto.subtle.importKey('spki', spki, algo, false, ['verify']); console.log('gc-prod-$n.cer read OK:', JSON.stringify(algo));" \
                || { echo "::error title=Game Center key unreadable::gc-prod-$n.cer could not be read by the server code"; exit 1; }
            fi
          done
          [ -n "$found" ] || { echo "::warning title=Game Center check::No Apple gc-prod certificates found to test"; exit 0; }
          top=$(echo $found | awk '{print $1}')
          body=$(jq -nc --arg u "https://static.gc.apple.com/public-key/gc-prod-$top.cer" --arg ts "$(date +%s%3N)" \
            '{playerId:"T:_smoketest",bundleId:"com.slingandslide.game",publicKeyUrl:$u,timestamp:$ts,salt:"AAAAAA==",signature:"AAAA",name:"x"}')
          res=$(curl -sS -X POST -H 'Content-Type: application/json' -d "$body" "$url/auth/gamecenter")
          echo "Live server answer: $res"
          why=$(echo "$res" | jq -r '.why // empty')
          if [ "$why" = signature ]; then echo "::notice title=Game Center sign-in check::Apple keys$found read OK; live server reached Apple and checked the signature."
          else echo "::error title=Game Center sign-in check::Live server refused before the signature check: $res"; exit 1; fi
