name: Check Game Center certificate

# Read-only: downloads Apple's Game Center identity certificates and checks the
# shop API's certificate reader (shop-api/accounts.js) can load their public keys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        run: |
          cat > /tmp/check.mjs <<'JS'
          import { spkiFromCert } from './shop-api/accounts.js';
          const out = [];
          for (const n of [6, 7, 8, 9, 10, 11, 12]) {
            const url = `https://static.gc.apple.com/public-key/gc-prod-${n}.cer`;
            try {
              const r = await fetch(url);
              if (!r.ok) { out.push(`${url}: HTTP ${r.status}`); continue; }
              const buf = new Uint8Array(await r.arrayBuffer());
              const { spki, algo } = spkiFromCert(buf);
              await crypto.subtle.importKey('spki', spki, algo, false, ['verify']);
              out.push(`${url}: OK ${algo.name}${algo.namedCurve ? ' ' + algo.namedCurve : ''} (${buf.length} bytes)`);
            } catch (e) { out.push(`${url}: FAILED ${e.message}`); }
          }
          console.log('::notice title=Game Center certificates::' + out.join('%0A'));
          JS
          node /tmp/check.mjs
